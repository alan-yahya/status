<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com https://raw.githubusercontent.com; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Lexifina service incident history." />
    <meta name="theme-color" content="#f6f1ea" />
    <title>Incident history · Lexifina Status</title>
    <link rel="icon" href="./lexifina-icon.png" type="image/png" />
    <link
      rel="preload"
      href="./fonts/CormorantGaramond-latin-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Manrope-latin-300-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./styles.css?v=lexifina-6" />
    <script src="./history.js" defer></script>
  </head>
  <body>
    <main class="page-shell history-page">
      <header class="brand-header">
        <a class="brand" href="https://lexifina.com/" aria-label="Lexifina home">
          <img src="./lexifina-icon.png" alt="" width="34" height="34" />
          <span>Lexifina</span>
        </a>
        <span class="page-label">Incident history</span>
      </header>

      <nav class="history-navigation" aria-label="Status page navigation">
        <a class="history-back-link" href="./">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10.5 3.5 6 8l4.5 4.5M6.5 8H14" />
          </svg>
          Back to current status
        </a>
      </nav>

      <section class="status-panel" aria-labelledby="history-title">
        <div class="panel-heading">
          <h1 id="history-title">Incident history</h1>
          <span>Most recent</span>
        </div>
        <div id="history-list" class="history-list" aria-busy="true">
          <div class="loading-row" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </body>
</html>
