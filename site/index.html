<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com https://raw.githubusercontent.com; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Live availability and incident history for Lexifina services." />
    <meta name="theme-color" content="#f6f1ea" />
    <title>Lexifina Status</title>
    <link rel="icon" href="./lexifina-icon.png" type="image/png" />
    <link
      rel="preload"
      href="./fonts/CormorantGaramond-latin-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Manrope-latin-300-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./styles.css?v=lexifina-6" />
    <script src="./component-catalog.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to system status</a>

    <main id="main-content" class="page-shell">
      <header class="brand-header">
        <a class="brand" href="https://lexifina.com/" aria-label="Lexifina home">
          <img src="./lexifina-icon.png" alt="" width="34" height="34" />
          <span>Lexifina</span>
        </a>
        <span class="page-label">Service status</span>
      </header>

      <section id="overall-card" class="overall-card is-loading" aria-live="polite">
        <span id="overall-icon" class="status-icon" aria-hidden="true"></span>
        <div>
          <h1 id="overall-title">Checking system status</h1>
          <p id="overall-copy">Retrieving the latest independent checks.</p>
        </div>
      </section>

      <section id="incident-card" class="incident-card" aria-labelledby="incident-title" hidden>
        <div class="incident-heading">
          <span class="status-icon" aria-hidden="true">!</span>
          <h2 id="incident-title">Active incident</h2>
        </div>
        <div id="active-incidents"></div>
      </section>

      <section class="status-panel" aria-labelledby="system-status-title">
        <div class="panel-heading">
          <h2 id="system-status-title">System status</h2>
          <span>Last 90 days</span>
        </div>
        <div id="component-list" class="component-list" aria-busy="true">
          <div class="loading-group" aria-hidden="true"></div>
          <div class="loading-group" aria-hidden="true"></div>
          <div class="loading-group" aria-hidden="true"></div>
        </div>
      </section>

      <footer class="page-footer">
        <a class="history-link" href="./history.html">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5 2.5v2M15 2.5v2M3 7h14M4.5 4h11A1.5 1.5 0 0 1 17 5.5v10a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-10A1.5 1.5 0 0 1 4.5 4Z" />
          </svg>
          View history
        </a>
      </footer>
    </main>

    <noscript>
      <p class="noscript">JavaScript is required to retrieve live system status.</p>
    </noscript>
  </body>
</html>
