status-website:
  # The page is the static site in site/, deployed to GitHub Pages by .github/workflows/pages.yml.
  publish: false
  cname: status.lexifina.com
  name: Lexifina Status
  logoUrl: https://status.lexifina.com/lexifina-icon.png
  favicon: https://status.lexifina.com/lexifina-icon.png

i18n:
  footer: "Lexifina service status"
  allSystemsOperational: All systems operational
  degradedSystem: Some systems are experiencing degraded performance
  completeOutage: Some systems are currently unavailable
  activeIncidents: Active incidents
  pastIncidents: Past incidents
  liveStatus: Live status
  overallUptime: Overall uptime
  averageResponseTime: Average response time
  up: Operational
  down: Unavailable
  degraded: Degraded
  status: Status
  history: History
  responseTime: Response time
  uptime: Uptime

workflowSchedule:
  uptime: "3-58/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
