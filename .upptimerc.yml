owner: alan-yahya
repo: status
user-agent: lexifina-status

# Every probe is a public URL; no repository secrets are passed to checks.
# No notifications are configured: incidents appear on the status page and as issues in this repository.
secrets: []
skipDeleteIssues: true

sites:
  - name: Website
    slug: website
    url: https://lexifina.com/
    icon: https://status.lexifina.com/lexifina-icon.png
    maxResponseTime: 5000
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: "Lexifina"

  - name: Web application
    slug: web-application
    url: https://app.lexifina.com/
    icon: https://status.lexifina.com/lexifina-icon.png
    maxResponseTime: 5000
